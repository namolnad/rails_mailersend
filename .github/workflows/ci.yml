name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The matrix is the gemspec's `required_ruby_version` claim, checked rather than
  # asserted. Four apps consume this and none of them run its tests, so a floor
  # nobody exercises is a floor nobody can rely on. Gemfile.lock is deliberately
  # not committed, so each job resolves its own dependencies — which is how the
  # 3.1 job ends up on minitest 5 while the rest are on 6.
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.1", "3.2", "3.3", "3.4" ]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test

  # One Ruby is enough: the rules come from rubocop-rails-omakase, and they do not
  # vary by interpreter.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rubocop
